name: quality

on:
  push:
    branches:
      - main
      - "module-1/**"
      - "module-2/**"
      - "module-3/**"
      - "module-4/**"
      - "module-5/**"
      - "instruction-2/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  architecture-tests:
    name: Architecture and browser checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run architecture tests
        run: npm test
      - name: Run browser acceptance tests
        run: npm run test:browser
      - name: Upload visual audit captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-audit-${{ github.sha }}
          path: test-results/**/*.png
          if-no-files-found: warn
          retention-days: 7
