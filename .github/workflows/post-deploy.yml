name: Post-deploy production verification

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: post-deploy-production
  cancel-in-progress: false

jobs:
  verify-production:
    name: Verify Cloudflare production release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v7

      - name: Read expected release marker
        id: release
        shell: bash
        run: |
          set -euo pipefail
          RELEASE="$(grep -oE '<meta name="traza-release" content="[^"]+"' index.html | sed -E 's/.*content="([^"]+)"/\1/')"
          if [[ -z "$RELEASE" ]]; then
            echo "::error::index.html no contiene meta traza-release."
            exit 1
          fi
          echo "value=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "Esperando la marca $RELEASE"

      - name: Wait for Cloudflare Worker to serve the exact release
        shell: bash
        env:
          BASE_URL: https://diagramas-de-flujo.davidsantiagosilvahernandez.workers.dev
          EXPECTED_RELEASE: ${{ steps.release.outputs.value }}
        run: |
          set -euo pipefail
          found=false
          for attempt in $(seq 1 30); do
            html="$(curl --silent --show-error --fail "$BASE_URL/" || true)"
            if [[ -n "$html" ]] && grep -Fq "name=\"traza-release\" content=\"$EXPECTED_RELEASE\"" <<< "$html"; then
              echo "Producción sirve la versión exacta: $EXPECTED_RELEASE"
              found=true
              break
            fi
            echo "Intento $attempt/30: esperando despliegue de $EXPECTED_RELEASE"
            sleep 20
          done
          if [[ "$found" != true ]]; then
            echo "::error::Cloudflare no publicó la marca $EXPECTED_RELEASE en 10 minutos."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke against production
        env:
          PLAYWRIGHT_BASE_URL: https://diagramas-de-flujo.davidsantiagosilvahernandez.workers.dev
        run: npx playwright test e2e/production-smoke.spec.js

      - name: Upload production screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-production-${{ steps.release.outputs.value }}
          path: test-results/**/*.png
          if-no-files-found: warn
          retention-days: 14
